<!DOCTYPE html>
<html lang="et">
<head>
  <meta charset="UTF-8">
  <title>LeafletJS kaart</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="stylesheet" href="css/style.css">
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
</head>
<body>

<nav>
  <a href="index.html">Avaleht</a>
  <a href="leaflet.html">LeafletJS</a>
  <a href="openlayers.html">OpenLayers</a>
  <a href="vordlus.html">Võrdlus</a>
</nav>

<main>
  <h1>LeafletJS kaart</h1>
  <div id="map"></div>
</main>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script src="https://unpkg.com/leaflet-omnivore@0.3.4/leaflet-omnivore.min.js"></script>
<script>
  var map = L.map('map').setView([59.4210, 24.7352], 14);
  L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
    attribution: '&copy; OpenStreetMap kaardistajad'
  }).addTo(map);

  L.control.scale({ metric: true, imperial: false }).addTo(map);

  var kmlLayer = omnivore.kml('AnastasiiaRadashevakaart.kml')
          .on('ready', function () {
            map.fitBounds(kmlLayer.getBounds());
          })
          .addTo(map);

  var kmlNahtav = true;
  var nupp = L.control({ position: 'topright' });
  nupp.onAdd = function () {
    var div = L.DomUtil.create('div', 'info-box');
    div.innerHTML = '<button id="toggle-btn">Peida/näita KML</button>';
    return div;
  };
  nupp.addTo(map);

  document.addEventListener('click', function (e) {
    if (e.target && e.target.id === 'toggle-btn') {
      if (kmlNahtav) {
        map.removeLayer(kmlLayer);
      } else {
        map.addLayer(kmlLayer);
      }
      kmlNahtav = !kmlNahtav;
    }
  });
</script>

</body>
</html>
